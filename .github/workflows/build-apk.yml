name: Build Reelix Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install Dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Build Static Export
        run: npm run build:static
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Check export output
        run: test -f out/index.html

      - name: Create fresh Capacitor Android project
        run: |
          rm -rf android
          npx cap add android

      - name: Patch AndroidManifest
        run: |
          python3 - <<'PY'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          perms = ['INTERNET','RECORD_AUDIO','MODIFY_AUDIO_SETTINGS','VIBRATE','READ_MEDIA_AUDIO','READ_MEDIA_VIDEO','READ_MEDIA_IMAGES']
          add = ''.join('    <uses-permission android:name="android.permission.%s" />\n' % x for x in perms if 'android.permission.%s"' % x not in s)
          s = s.replace('</manifest>', add + '</manifest>')
          if 'largeHeap' not in s:
              s = s.replace('<application', '<application android:largeHeap="true" android:hardwareAccelerated="true"', 1)
          open(p, 'w', encoding='utf-8').write(s)
          PY

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build APK with Gradle
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Reelix-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

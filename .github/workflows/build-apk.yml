name: Build Reelix APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Capacitor 6 needs JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # The repo has bun.lock but no package-lock.json, so `npm ci` cannot be used.
      - name: Install dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps

      # BUILD_TARGET=static switches next.config.ts to `output: 'export'` -> ./out
      - name: Build static web app
        run: npm run build:static
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Check static output exists
        run: test -f out/index.html

      # Generate a fresh Android project (nothing Android-related is committed to the repo)
      - name: Add Android platform
        run: |
          rm -rf android
          npx cap add android

      - name: Add permissions and hardware acceleration to the manifest
        run: |
          python3 - <<'PY'
          import re
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          perms = [
              'android.permission.INTERNET',
              'android.permission.RECORD_AUDIO',
              'android.permission.MODIFY_AUDIO_SETTINGS',
              'android.permission.VIBRATE',
              'android.permission.READ_MEDIA_AUDIO',
              'android.permission.READ_MEDIA_VIDEO',
              'android.permission.READ_MEDIA_IMAGES',
          ]
          add = ''.join('    <uses-permission android:name="%s" />\n' % x for x in perms if x not in s)
          s = s.replace('<application', add + '    <application', 1)
          if 'android:largeHeap' not in s:
              s = s.replace('<application', '<application android:largeHeap="true" android:hardwareAccelerated="true"', 1)
          open(p, 'w', encoding='utf-8').write(s)
          print(s)
          PY

      - name: Sync web assets into Android
        run: npx cap sync android

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Reelix-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
